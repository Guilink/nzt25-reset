<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a100c">
<meta name="color-scheme" content="dark">
<!-- recarrega a cada 10 min caso o app de widget congele os scripts -->
<meta http-equiv="refresh" content="600">
<title>NZT-25 · Agora</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Widget: página compacta que se adapta a qualquer tamanho de widget.
   Parâmetros opcionais na URL:
     ?fundo=transparente   fundo transparente (se o app de widget suportar)
     ?inicio=AAAA-MM-DD    data do Dia 1, se for diferente da padrão     */
:root{
  --bg:#0a100c; --line:#213328; --text:#e6eee8; --muted:#8fa597; --faint:#5f7567;
  --accent:#8ccf9d; --accentDim:#2f5a3d;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* escala única: acompanha o lado menor do widget */
  --u:min(4.2vw, 7.2vh);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body.transp{background:transparent}
body.transp a{background:rgba(10,16,12,.86)}
a{display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:calc(var(--u)*1.25) calc(var(--u)*1.4);color:inherit;text-decoration:none;
  background:radial-gradient(110% 90% at 0% 0%,rgba(140,207,157,.10),transparent 60%),var(--bg)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:calc(var(--u)*.78);color:var(--muted);white-space:nowrap}
.top b{color:var(--accent);font-weight:700;letter-spacing:.06em}
.top .ph{overflow:hidden;text-overflow:ellipsis}
.top .dt{font-family:var(--mono);color:var(--faint)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:calc(var(--u)*.5) 0}
.lbl{display:flex;align-items:center;gap:.5em;font-size:calc(var(--u)*.72);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lbl span{font-family:var(--mono);font-weight:400;letter-spacing:0;color:var(--muted)}
.dot{width:.55em;height:.55em;border-radius:50%;background:var(--accent)}
.t{font-size:calc(var(--u)*1.9);font-weight:700;line-height:1.08;letter-spacing:-.015em;margin-top:.22em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d{font-size:calc(var(--u)*.8);color:var(--muted);margin-top:.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:calc(var(--u)*.74);color:var(--muted);margin-top:.6em}
.bar{height:max(2px,calc(var(--u)*.16));border-radius:4px;background:var(--line);margin-top:.45em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.next{font-size:calc(var(--u)*.8);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line);padding-top:calc(var(--u)*.55)}
.next b{color:var(--text);font-weight:600}
/* widgets baixos: esconde detalhes secundários */
@media (max-height:190px){ .d{display:none} }
@media (max-height:140px){ .next{display:none} .top .ph{display:none} }
@media (max-height:105px){ .top,.bar{display:none} .meta{margin-top:.3em} }
[hidden]{display:none!important}
</style>
</head>
<body>
<a href="./" target="_blank" rel="noopener">
  <div class="top"><span class="ph"><b id="day">DIA —</b> <span id="phase"></span></span><span class="dt" id="date"></span></div>
  <div class="mid">
    <div class="lbl"><i class="dot"></i>Agora <span id="clock"></span></div>
    <div class="t" id="title">—</div>
    <div class="d" id="desc"></div>
    <div class="meta"><span id="range"></span><span id="left"></span></div>
    <div class="bar" id="barWrap"><i id="bar"></i></div>
  </div>
  <div class="next" id="next"></div>
</a>
<script src="protocol.js"></script>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
if (qs.get("fundo") === "transparente") document.body.classList.add("transp");

function startDate(){
  const q = qs.get("inicio");
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  // mesma origem do app: se aberto no mesmo navegador, respeita a data escolhida nos ajustes
  try{
    const s = JSON.parse(localStorage.getItem("nzt25.reset.v1") || "null");
    if (s && s.startSetByUser && s.startDate) return s.startDate;
  }catch(e){}
  return DEFAULT_START;
}
const $ = id => document.getElementById(id);
const fmtDate = new Intl.DateTimeFormat("pt-BR", { weekday:"short", day:"2-digit", month:"2-digit" });

function render(){
  const now = new Date(), b = nowBlock(now, startDate());
  if (b.inProtocol){
    $("day").textContent = "DIA " + String(b.dayN).padStart(2,"0") + "/25";
    $("phase").textContent = "· " + b.phase.name;
  } else if (b.dayN < 1){
    $("day").textContent = "NZT-25";
    $("phase").textContent = b.dayN === 0 ? "· começa amanhã" : "· começa em " + (1 - b.dayN) + " dias";
  } else {
    $("day").textContent = "NZT-25";
    $("phase").textContent = "· protocolo concluído";
  }
  $("date").textContent = fmtDate.format(now).replace(".", "");
  $("clock").textContent = b.clock;
  $("title").textContent = b.t;
  $("desc").textContent = b.d; $("desc").hidden = !b.d;
  $("range").textContent = b.range + (b.flexible ? " · flexível" : "");
  $("left").textContent = b.minsLeft == null ? "" : fmtLeft(b.minsLeft).replace(" restantes", "");
  $("barWrap").hidden = b.frac == null;
  if (b.frac != null) $("bar").style.width = (b.frac*100).toFixed(1) + "%";
  $("next").innerHTML = "Depois · <b></b>";
  $("next").querySelector("b").textContent = (b.next.h === "amanhã" ? "amanhã, " : b.next.h + " ") + b.next.t;
  document.title = "NZT-25 · " + b.t;
}
render();
setInterval(render, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
</html>
